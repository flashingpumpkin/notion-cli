name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Rebuild release for tag (e.g., v0.1.0)'
        required: false

permissions:
  contents: write

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: semantic
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          allow-initial-development-versions: true

  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    needs: [semantic-release]
    if: always() && (needs.semantic-release.outputs.version != '' || github.event_name == 'workflow_dispatch')
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
            echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          else
            echo "tag=v${{ needs.semantic-release.outputs.version }}" >> $GITHUB_OUTPUT
            echo "version=${{ needs.semantic-release.outputs.version }}" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build
    needs: [resolve-version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          OUTPUT=notion-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          [ "${{ matrix.goos }}" = "windows" ] && OUTPUT="${OUTPUT}.exe"
          go build -ldflags "-X main.version=${{ needs.resolve-version.outputs.version }}" -o "${OUTPUT}" .
      - uses: actions/upload-artifact@v6
        with:
          name: notion-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: notion-cli-*

  upload:
    name: Upload
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: ./artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          files: ./artifacts/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
